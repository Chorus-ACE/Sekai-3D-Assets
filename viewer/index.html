<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script>document.documentElement.dataset.viewerTheme=window.viewerColorScheme??(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');</script>
<style>
:root{color-scheme:light;--background:#edfaff;--text:#243550;--focus:#4387dc}
:root[data-viewer-theme=dark]{color-scheme:dark;--background:#1b2433;--text:#e7edf8;--focus:#8cbbff}
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:system-ui,sans-serif;color:var(--text)}
body{background:var(--background)}canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
canvas:focus-visible{outline:2px solid var(--focus);outline-offset:-3px}
</style>
</head>
<body>
<canvas id="viewer" tabindex="0" data-label="viewer.canvas"></canvas>
<script type="module" src="./native-main.ts"></script>
</body>
</html>
